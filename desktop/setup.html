<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; background: #15181d; color: #eee; padding: 20px; }
      input, select, button { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
      button { background: #3b82f6; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      small { color: #999; }
    </style>
  </head>
  <body>
    <label>AoE4 World profile ID</label>
    <input id="id" placeholder="e.g. 7090781" />
    <small>The number in your aoe4world.com/players/<b>7090781</b>-name URL</small>
    <br /><br />
    <label>Theme</label>
    <select id="theme">
      <option value="floating">Floating</option>
      <option value="top">Top</option>
    </select>
    <button id="save">Start overlay</button>
    <small>Ctrl+Shift+O hide/show · Ctrl+Shift+P settings · Ctrl+Shift+Q quit</small>
    <script>
      const $ = (s) => document.getElementById(s);
      overlayApi.getConfig().then((c) => {
        if (c.profileId) $("id").value = c.profileId;
        if (c.theme) $("theme").value = c.theme;
      });
      $("save").onclick = () => {
        const profileId = $("id").value.trim();
        if (!/^\d+$/.test(profileId)) return alert("Profile ID must be a number");
        overlayApi.save({ profileId, theme: $("theme").value });
      };
    </script>
  </body>
</html>
